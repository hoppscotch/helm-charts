suite: Default Init Container Wait for Database
templates:
  - aio/deployment.yaml
  - backend/deployment.yaml
  - config/configmap.yaml
  - config/secret.yaml
tests:
  - it: should generate init container when enabled
    template: aio/deployment.yaml
    set:
      defaultInitContainers:
        waitForDatabase:
          enabled: true
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
          any: true

  - it: should not generate init container when disabled
    template: aio/deployment.yaml
    set:
      defaultInitContainers:
        waitForDatabase:
          enabled: false
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
          any: true

  - it: should set container image to postgres by default
    template: aio/deployment.yaml
    set:
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
            image: postgres:16-alpine
          any: true

  - it: should set container image to component image when specified
    template: aio/deployment.yaml
    set:
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
          image:
            repository: custom/postgres
            tag: 18-alpine
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
            image: custom/postgres:18-alpine
          any: true

  - it: should set container image to component registry when specified
    template: aio/deployment.yaml
    set:
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
          image:
            registry: component-registry.example.com
            repository: postgres
            tag: 16-alpine
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
            image: component-registry.example.com/postgres:16-alpine
          any: true

  - it: should set container image with global registry when specified
    template: aio/deployment.yaml
    set:
      global:
        imageRegistry: global-registry.example.com
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
          image:
            repository: postgres
            tag: 16-alpine
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
            image: global-registry.example.com/postgres:16-alpine
          any: true

  - it: should set container image without tag when component tag is empty
    template: aio/deployment.yaml
    set:
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
          image:
            repository: postgres
            tag: ""
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
            image: postgres
          any: true

  - it: should set container image pull policy to `IfNotPresent` by default
    template: aio/deployment.yaml
    set:
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
            imagePullPolicy: IfNotPresent
          any: true

  - it: should set container image pull policy to component image pull policy when specified
    template: aio/deployment.yaml
    set:
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
          image:
            pullPolicy: Always
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
            imagePullPolicy: Always
          any: true

  - it: should set extra env vars when specified
    template: aio/deployment.yaml
    set:
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
          extraEnvVars:
            - name: EXTRA_ENV_VAR_1
              value: value_1
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
            env:
              - name: EXTRA_ENV_VAR_1
                value: value_1
          any: true

  - it: should set extra env vars config map when specified
    template: aio/deployment.yaml
    set:
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
          extraEnvVarsCM: extra-env-vars-config-map
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
            envFrom:
              - configMapRef:
                  name: extra-env-vars-config-map
          any: true

  - it: should set extra env vars secret when specified
    template: aio/deployment.yaml
    set:
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
          extraEnvVarsSecret: env-vars-secret
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-db
            envFrom:
              - secretRef:
                  name: env-vars-secret
          any: true

  - it: should set default resources from the nano preset
    template: aio/deployment.yaml
    set:
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-db
      - equal:
          path: spec.template.spec.initContainers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.initContainers[0].resources.limits.memory
          value: 192Mi

  - it: should override init container resources when explicitly set
    template: aio/deployment.yaml
    set:
      deploymentMode: aio
      defaultInitContainers:
        waitForDatabase:
          enabled: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-db
      - equal:
          path: spec.template.spec.initContainers[0].resources.requests.cpu
          value: 25m
      - equal:
          path: spec.template.spec.initContainers[0].resources.limits.memory
          value: 64Mi
